<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ocs-local-tiku — 本地 AI 题库服务</title>
  <desc id="hero-desc">ocs-local-tiku：OCS 网课助手的本地 AI 题库服务。左侧为项目名与核心承诺：缓存命中毫秒级返回、未命中由 LLM 多 API 兜底、数据单文件存储。右侧为查询管线：题目请求经规范化与 MD5 后查 SQLite 缓存，命中则毫秒级本地返回，未命中则由 LLM 作答并写回缓存。</desc>

  <defs>
    <linearGradient id="bg-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161F"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="380" rx="26" fill="url(#bg-sheen)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="25.25" fill="none" stroke="#21262D" stroke-width="1.5"/>

  <!-- ============ left: identity ============ -->
  <g id="identity" transform="translate(64 58)">
    <!-- eyebrow: local service address -->
    <circle cx="6" cy="-5" r="5" fill="#3FB950"/>
    <text x="22" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#58A6FF">http://127.0.0.1:8000</text>

    <!-- project name -->
    <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="60" font-weight="700" fill="#E6EDF3">ocs-local-tiku</text>

    <!-- tagline -->
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="29" font-weight="600" fill="#C9D1D9">OCS 网课助手 · 本地 AI 题库服务</text>

    <!-- one-line mechanism -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#8B949E">不依赖在线题库 · LLM 答题 · SQLite 题目哈希缓存</text>

    <!-- value chips -->
    <g id="chips">
      <rect x="0" y="182" width="4" height="24" rx="2" fill="#3FB950"/>
      <text x="16" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#E6EDF3">命中 <tspan fill="#8B949E">→</tspan> 毫秒级返回 <tspan fill="#8B949E">·</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3FB950">0 token</tspan></text>

      <rect x="0" y="226" width="4" height="24" rx="2" fill="#58A6FF"/>
      <text x="16" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#E6EDF3">未命中 <tspan fill="#8B949E">→</tspan> LLM 兜底 <tspan fill="#8B949E">·</tspan> 多 API 优先级 failover</text>

      <rect x="0" y="270" width="4" height="24" rx="2" fill="#8B949E"/>
      <text x="16" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#E6EDF3">数据单文件 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#C9D1D9">tiku.db</tspan> <tspan fill="#8B949E">· 备份即复制</tspan></text>
    </g>
  </g>

  <!-- ============ right: query pipeline (the project's proof) ============ -->
  <g id="pipeline" transform="translate(712 60)">
    <!-- node 1: request -->
    <rect x="0" y="0" width="424" height="48" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#8B949E">OCS 题目请求</text>
    <text x="406" y="30" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#58A6FF">GET /api/query</text>

    <!-- edge: normalize + hash -->
    <line x1="212" y1="48" x2="212" y2="74" stroke="#30363D" stroke-width="2"/>
    <path d="M 206 68 L 212 76 L 218 68" fill="none" stroke="#30363D" stroke-width="2"/>
    <text x="228" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#8B949E">规范化 · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MD5</tspan></text>

    <!-- node 2: hash key -->
    <rect x="0" y="80" width="424" height="44" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#8B949E">题目哈希键</text>
    <text x="406" y="108" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C9D1D9"># 3f2ac9…8d41</text>

    <!-- branch edges: each arrow drops into its own card below -->
    <path d="M 106 124 L 106 170" fill="none" stroke="#3FB950" stroke-width="2"/>
    <path d="M 100 164 L 106 172 L 112 164" fill="none" stroke="#3FB950" stroke-width="2"/>
    <text x="120" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#3FB950">命中</text>

    <path d="M 318 124 L 318 170" fill="none" stroke="#58A6FF" stroke-width="2"/>
    <path d="M 312 164 L 318 172 L 324 164" fill="none" stroke="#58A6FF" stroke-width="2"/>
    <text x="332" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#58A6FF">未命中</text>

    <!-- node 3: cache hit (left card) -->
    <rect x="0" y="182" width="206" height="76" rx="12" fill="#122117" stroke="#2EA04366" stroke-width="1.5"/>
    <text x="18" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#3FB950">✓ SQLite 命中</text>
    <text x="18" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#8B949E">毫秒级 · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0 token</tspan></text>

    <!-- node 4: llm fallback (right card) -->
    <rect x="218" y="182" width="206" height="76" rx="12" fill="#0D1524" stroke="#1F6FEB66" stroke-width="1.5"/>
    <text x="236" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#58A6FF">✗ LLM 答题</text>
    <text x="236" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#8B949E">解析校验 · 写回缓存</text>
  </g>
</svg>
